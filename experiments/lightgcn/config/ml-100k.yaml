# LightGCN 在 MovieLens 100K 上的基线配置。
#
# 该文件只描述实验参数；数据路径和输出路径由 run_lightgcn.py 传入绝对路径，
# 这样无论从仓库根目录还是其他目录启动脚本，文件都不会写到意外位置。

# ---------- 数据字段 ----------
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp
field_separator: "\t"
load_col:
  inter: [user_id, item_id, rating, timestamp]

# ---------- 训练 ----------
epochs: 10
train_batch_size: 2048
learner: adam
learning_rate: 0.001
embedding_size: 64
n_layers: 3
reg_weight: 0.00001
loss_type: BPR
train_neg_sample_args:
  distribution: uniform
  sample_num: 1

# ---------- 评估 ----------
# RS 表示随机划分，比例为 train/valid/test = 8/1/1；
# RO 表示不依赖时间字段的随机排序，更适合本次通用协同过滤基线。
eval_args:
  split: {RS: [8, 1, 1]}
  group_by: user
  order: RO
  mode: full
metrics: [Recall, Hit, NDCG, MRR]
topk: [10, 20]
valid_metric: NDCG@10
valid_metric_bigger: true
eval_batch_size: 4096
stopping_step: 3

# ---------- 运行环境 ----------
# AutoDL NVIDIA 环境默认使用第 0 张 GPU；运行脚本会再次校验 CUDA 是否可用。
gpu_id: 0
seed: 2026
reproducibility: true
show_progress: true
save_dataset: false
save_dataloaders: false
log_wandb: false
